name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: sam-fuzzy-linux-x86_64
            is_windows: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: sam-fuzzy-linux-x86_64-musl
            is_windows: false
            use_musl: true
          - target: x86_64-apple-darwin
            os: macos-13
            artifact_name: sam-fuzzy-macos-x86_64
            is_windows: false
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: sam-fuzzy-macos-arm64
            is_windows: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: sam-fuzzy-windows-x86_64
            is_windows: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.use_musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip Unix binary
        if: "!matrix.is_windows"
        run: |
          strip target/${{ matrix.target }}/release/sam-fuzzy || true

      - name: Package Unix archive
        if: "!matrix.is_windows"
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/sam-fuzzy dist/
          cp README.md LICENSE dist/
          tar -czvf ${{ matrix.artifact_name }}.tar.gz -C dist sam-fuzzy README.md LICENSE
          sha256sum ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256

      - name: Package Windows archive
        if: matrix.is_windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target }}/release/sam-fuzzy.exe dist/
          Copy-Item README.md dist/
          Copy-Item LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.artifact_name }}.zip"
          Get-FileHash -Algorithm SHA256 "${{ matrix.artifact_name }}.zip" | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Out-File -Encoding ascii "${{ matrix.artifact_name }}.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.*

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Display downloaded artifacts
        run: ls -lh release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
