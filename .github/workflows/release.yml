name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: sam-fuzzy-linux-x86_64
            is_windows: false
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: sam-fuzzy-macos-arm64
            is_windows: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: sam-fuzzy-windows-x86_64
            is_windows: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip Unix binary
        if: "!matrix.is_windows"
        run: |
          strip target/${{ matrix.target }}/release/sam-fuzzy || true

      - name: Prepare Unix binary
        if: "!matrix.is_windows"
        run: |
          cp target/${{ matrix.target }}/release/sam-fuzzy ${{ matrix.artifact_name }}

      - name: Prepare Windows binary
        if: matrix.is_windows
        shell: pwsh
        run: |
          Copy-Item target/${{ matrix.target }}/release/sam-fuzzy.exe "${{ matrix.artifact_name }}.exe"

      - name: Upload Unix artifact
        if: "!matrix.is_windows"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

      - name: Upload Windows artifact
        if: matrix.is_windows
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.exe

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Display downloaded artifacts
        run: ls -lh release-artifacts

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-artifacts/*
          generate_release_notes: false
          body: |
            ### SAM-FUZZY ◈ DhakaFlix Media Explorer

            Zero-lag, 104k+ indexed items terminal media explorer for SamOnline FTP mirrors.

            #### Standalone Binaries:
            - 🪟 **Windows**: [`sam-fuzzy-windows-x86_64.exe`](https://github.com/Shantodotdev/sam-fuzzy/releases/download/${{ github.ref_name }}/sam-fuzzy-windows-x86_64.exe)
            - 🍏 **macOS (Apple Silicon)**: [`sam-fuzzy-macos-arm64`](https://github.com/Shantodotdev/sam-fuzzy/releases/download/${{ github.ref_name }}/sam-fuzzy-macos-arm64)
            - 🐧 **Linux (x86_64)**: [`sam-fuzzy-linux-x86_64`](https://github.com/Shantodotdev/sam-fuzzy/releases/download/${{ github.ref_name }}/sam-fuzzy-linux-x86_64)

            #### Quick Install (Linux & macOS):
            ```bash
            curl -fsSL https://raw.githubusercontent.com/Shantodotdev/sam-fuzzy/main/install.sh | bash
            ```
          draft: false
          prerelease: false
